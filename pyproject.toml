[project]
name = "safetycircuits"
version = "0.1.0"
description = "Interpreting refusal and jailbreaks in Gemma-2-2B-it with a refusal direction, sparse autoencoders and steering"
requires-python = ">=3.11"

[tool.setuptools]
packages = ["safetycircuits"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
